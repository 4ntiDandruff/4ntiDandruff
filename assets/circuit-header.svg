<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Neon Circuit Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#162238" stroke-width="0.75" opacity="0.6" />
      <circle cx="20" cy="0" r="1" fill="#1e3354" opacity="0.8" />
    </pattern>

    <!-- Oscilloscope Sine Wave Keyframes -->
    <style>
      @keyframes pulseTrace {
        0% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes signalDot {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes blinkLed {
        0%, 100% { fill: #00f2fe; opacity: 0.9; }
        50% { fill: #005f73; opacity: 0.3; }
      }
      @keyframes blinkPower {
        0%, 100% { fill: #00ff66; opacity: 1; }
        50% { fill: #008f39; opacity: 0.4; }
      }
      .trace-pulse {
        stroke-dasharray: 120 480;
        animation: pulseTrace 4s linear infinite;
      }
      .sine-wave {
        stroke-dasharray: 8 4;
        animation: pulseTrace 6s linear infinite;
      }
      .led-active {
        animation: blinkLed 1.8s ease-in-out infinite;
      }
      .led-power {
        animation: blinkPower 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)" stroke="#1f2d48" stroke-width="1.5" />
  
  <!-- PCB Grid Overlay -->
  <rect width="900" height="240" rx="14" fill="url(#gridPattern)" />

  <!-- Corner Chip Pins / Bracket Decoration -->
  <g stroke="#2a3f66" stroke-width="1.2">
    <!-- Top Left -->
    <path d="M 20 50 L 20 20 L 50 20" fill="none" />
    <circle cx="20" cy="50" r="2.5" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="50" cy="20" r="2.5" fill="#00f2fe" filter="url(#glowCyan)" />

    <!-- Top Right -->
    <path d="M 850 20 L 880 20 L 880 50" fill="none" />
    <circle cx="850" cy="20" r="2.5" fill="#4facfe" />
    <circle cx="880" cy="50" r="2.5" fill="#4facfe" />

    <!-- Bottom Left -->
    <path d="M 20 190 L 20 220 L 50 220" fill="none" />
    <circle cx="20" cy="190" r="2.5" fill="#ffb199" />
    <circle cx="50" cy="220" r="2.5" fill="#ffb199" />

    <!-- Bottom Right -->
    <path d="M 850 220 L 880 220 L 880 190" fill="none" />
    <circle cx="850" cy="220" r="2.5" fill="#00ff66" filter="url(#glowCyan)" />
    <circle cx="880" cy="190" r="2.5" fill="#00ff66" filter="url(#glowCyan)" />
  </g>

  <!-- PCB Circuit Traces (Left Side) -->
  <g stroke="#1d3557" stroke-width="2" fill="none">
    <path d="M 40 70 L 110 70 L 140 100 L 180 100" />
    <path d="M 40 110 L 90 110 L 120 140 L 160 140" />
    <path d="M 40 150 L 130 150 L 150 170 L 200 170" />
    <path d="M 80 220 L 80 190 L 110 160 L 150 160" />
  </g>

  <!-- Active Neon Traces (Animated Pulse) -->
  <g stroke="url(#cyanGrad)" stroke-width="2" fill="none" filter="url(#glowCyan)">
    <path class="trace-pulse" d="M 40 70 L 110 70 L 140 100 L 180 100" />
    <path class="trace-pulse" d="M 40 150 L 130 150 L 150 170 L 200 170" style="animation-delay: 1.5s;" />
  </g>

  <!-- Vias / Solder Pads (Left) -->
  <g fill="#0c1829" stroke="#00f2fe" stroke-width="1.5">
    <circle cx="40" cy="70" r="4" />
    <circle cx="180" cy="100" r="3.5" fill="#00f2fe" />
    <circle cx="40" cy="110" r="3" />
    <circle cx="160" cy="140" r="3" />
    <circle cx="40" cy="150" r="4" />
    <circle cx="200" cy="170" r="3.5" fill="#00f2fe" />
  </g>

  <!-- PCB Circuit Traces (Right Side) -->
  <g stroke="#1d3557" stroke-width="2" fill="none">
    <path d="M 860 70 L 790 70 L 760 100 L 720 100" />
    <path d="M 860 110 L 810 110 L 780 140 L 740 140" />
    <path d="M 860 150 L 770 150 L 750 170 L 700 170" />
    <path d="M 820 220 L 820 190 L 790 160 L 750 160" />
  </g>

  <!-- Active Neon Traces Right -->
  <g stroke="url(#orangeGrad)" stroke-width="2" fill="none" filter="url(#glowOrange)">
    <path class="trace-pulse" d="M 860 70 L 790 70 L 760 100 L 720 100" style="animation-delay: 2s;" />
    <path class="trace-pulse" d="M 860 150 L 770 150 L 750 170 L 700 170" style="animation-delay: 0.7s;" />
  </g>

  <!-- Vias / Solder Pads (Right) -->
  <g fill="#0c1829" stroke="#ffb199" stroke-width="1.5">
    <circle cx="860" cy="70" r="4" />
    <circle cx="720" cy="100" r="3.5" fill="#ffb199" />
    <circle cx="860" cy="110" r="3" />
    <circle cx="740" cy="140" r="3" />
    <circle cx="860" cy="150" r="4" />
    <circle cx="700" cy="170" r="3.5" fill="#ffb199" />
  </g>

  <!-- Center Content Badge Base -->
  <g>
    <!-- IC Chip Center Silhouette -->
    <rect x="220" y="30" width="460" height="180" rx="8" fill="#080e1a" stroke="#1f3352" stroke-width="1.2" />
    
    <!-- IC Notches / Pin Marks -->
    <circle cx="232" cy="42" r="3" fill="#1f3352" />
    <rect x="435" y="30" width="30" height="4" rx="2" fill="#1f3352" />

    <!-- Terminal Status Bar -->
    <g transform="translate(240, 52)">
      <circle cx="0" cy="0" r="4" fill="#ff5f56" />
      <circle cx="12" cy="0" r="4" fill="#ffbd2e" />
      <circle cx="24" cy="0" r="4" fill="#27c93f" />
      <text x="40" y="4" fill="#4d6b94" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" letter-spacing="1">MEGAPASS // BENCH_DAEMON_V2.0</text>
      
      <!-- Live Status Indicator -->
      <circle class="led-power" cx="400" cy="0" r="3.5" />
      <text x="360" y="3" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.5">ONLINE</text>
    </g>

    <!-- Main Title -->
    <text x="450" y="105" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">
      HIZAM NAHARI
    </text>

    <!-- Subtitle / Role -->
    <text x="450" y="132" text-anchor="middle" fill="url(#cyanGrad)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700" letter-spacing="2">
      CIRCUIT TECHNICIAN • HARDWARE • SYSTEMS AUTOMATION
    </text>

    <!-- Bottom Tagline / Ethos -->
    <g transform="translate(450, 162)">
      <rect x="-185" y="-12" width="370" height="24" rx="12" fill="#0d1b2e" stroke="#223d63" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#9ec5fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">
        ⚡ 0% Idle CPU  •  Native Daemons  •  Zero Bloat
      </text>
    </g>

    <!-- Mini Bottom Info Bar -->
    <g transform="translate(450, 195)">
      <text x="-160" y="0" fill="#5879a2" font-family="'JetBrains Mono', monospace" font-size="9.5">📍 Sidoarjo, ID</text>
      <text x="-45" y="0" fill="#5879a2" font-family="'JetBrains Mono', monospace" font-size="9.5">🔬 BNSP 100/100 Theory</text>
      <text x="90" y="0" fill="#5879a2" font-family="'JetBrains Mono', monospace" font-size="9.5">🛠️ Megapass Intra Solusindo</text>
    </g>
  </g>
</svg>
