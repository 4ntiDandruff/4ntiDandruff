<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Translucent Tech-Glass Panel -->
    <linearGradient id="techGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b2e" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#081322" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#040a13" stop-opacity="0.95" />
    </linearGradient>

    <!-- Capsule Gradient -->
    <linearGradient id="capsuleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#061220" />
      <stop offset="50%" stop-color="#0b1b30" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyanSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Traces -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonCyanRev" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Subtle PCB Grid Patterns -->
    <pattern id="canvasPcbGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0f192b" stroke-width="0.75" opacity="0.6" />
      <circle cx="24" cy="0" r="1" fill="#172740" opacity="0.7" />
    </pattern>

    <pattern id="panelInnerGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#142238" stroke-width="0.5" opacity="0.5" />
      <circle cx="18" cy="0" r="0.8" fill="#1a2d48" opacity="0.6" />
    </pattern>

    <style>
      @keyframes pulseTrace1 {
        0% { stroke-dashoffset: 700; opacity: 0.15; }
        45% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.15; }
      }
      @keyframes pulseTrace2 {
        0% { stroke-dashoffset: 600; opacity: 0.15; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.15; }
      }
      @keyframes blinkOnline {
        0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 6px #00ff66); }
        50% { fill: #008f39; filter: none; }
      }
      .anim-trace-left {
        stroke-dasharray: 120 480;
        animation: pulseTrace1 4.5s linear infinite;
      }
      .anim-trace-right {
        stroke-dasharray: 120 480;
        animation: pulseTrace2 4.5s linear infinite;
        animation-delay: 1.2s;
      }
      .live-dot {
        animation: blinkOnline 2s ease-in-out infinite;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- ======================================================== -->
  <!-- CANVAS BASE & BACKGROUND                                 -->
  <!-- ======================================================== -->
  <rect width="960" height="320" rx="14" fill="url(#canvasBg)" stroke="#1a2b48" stroke-width="1.5" />
  <rect width="960" height="320" rx="14" fill="url(#canvasPcbGrid)" />

  <!-- ======================================================== -->
  <!-- SYMMETRICAL CIRCUIT BOARD TRACES & NODES                 -->
  <!-- ======================================================== -->

  <!-- Left Side: Symmetrical Base Traces -->
  <g stroke="#122037" stroke-width="2" fill="none">
    <path d="M 16 45 L 75 45 L 105 75 L 140 75" />
    <path d="M 16 95 L 60 95 L 95 130 L 135 130" />
    <path d="M 16 145 L 85 145 L 115 175 L 140 175" />
    <path d="M 16 195 L 50 195 L 85 230 L 135 230" />
    <path d="M 16 245 L 90 245 L 115 270 L 140 270" />
    <path d="M 50 16 L 50 60 L 75 85 L 75 160" />
    <path d="M 105 304 L 105 250 L 125 230" />
  </g>

  <!-- Left Side: Glowing Neon Cyan Traces -->
  <g stroke="url(#neonCyan)" stroke-width="2.2" fill="none" filter="url(#glowCyan)">
    <path class="anim-trace-left" d="M 16 45 L 75 45 L 105 75 L 140 75" />
    <path class="anim-trace-left" d="M 16 145 L 85 145 L 115 175 L 140 175" style="animation-delay: 1.5s;" />
    <path class="anim-trace-left" d="M 16 245 L 90 245 L 115 270 L 140 270" style="animation-delay: 2.8s;" />
  </g>

  <!-- Left Side: Solder Vias & Terminal Node Dots -->
  <g fill="#07101e" stroke="#00f2fe" stroke-width="1.6">
    <circle cx="16" cy="45" r="3.5" />
    <circle cx="140" cy="75" r="3.5" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="16" cy="95" r="3" stroke="#25436e" />
    <circle cx="135" cy="130" r="3" stroke="#25436e" />
    <circle cx="16" cy="145" r="3.5" />
    <circle cx="140" cy="175" r="3.5" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="16" cy="195" r="3" stroke="#25436e" />
    <circle cx="135" cy="230" r="3" stroke="#25436e" />
    <circle cx="16" cy="245" r="3.5" />
    <circle cx="140" cy="270" r="3.5" fill="#00f2fe" filter="url(#glowCyan)" />
  </g>

  <!-- Right Side: Symmetrical Base Traces (Mirrored) -->
  <g stroke="#122037" stroke-width="2" fill="none">
    <path d="M 944 45 L 885 45 L 855 75 L 820 75" />
    <path d="M 944 95 L 900 95 L 865 130 L 825 130" />
    <path d="M 944 145 L 875 145 L 845 175 L 820 175" />
    <path d="M 944 195 L 910 195 L 875 230 L 825 230" />
    <path d="M 944 245 L 870 245 L 845 270 L 820 270" />
    <path d="M 910 16 L 910 60 L 885 85 L 885 160" />
    <path d="M 855 304 L 855 250 L 835 230" />
  </g>

  <!-- Right Side: Glowing Neon Cyan Traces (Mirrored) -->
  <g stroke="url(#neonCyanRev)" stroke-width="2.2" fill="none" filter="url(#glowCyan)">
    <path class="anim-trace-right" d="M 944 45 L 885 45 L 855 75 L 820 75" />
    <path class="anim-trace-right" d="M 944 145 L 875 145 L 845 175 L 820 175" style="animation-delay: 1.5s;" />
    <path class="anim-trace-right" d="M 944 245 L 870 245 L 845 270 L 820 270" style="animation-delay: 2.8s;" />
  </g>

  <!-- Right Side: Solder Vias & Terminal Node Dots (Mirrored) -->
  <g fill="#07101e" stroke="#00f2fe" stroke-width="1.6">
    <circle cx="944" cy="45" r="3.5" />
    <circle cx="820" cy="75" r="3.5" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="944" cy="95" r="3" stroke="#25436e" />
    <circle cx="825" cy="130" r="3" stroke="#25436e" />
    <circle cx="944" cy="145" r="3.5" />
    <circle cx="820" cy="175" r="3.5" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="944" cy="195" r="3" stroke="#25436e" />
    <circle cx="825" cy="230" r="3" stroke="#25436e" />
    <circle cx="944" cy="245" r="3.5" />
    <circle cx="820" cy="270" r="3.5" fill="#00f2fe" filter="url(#glowCyan)" />
  </g>

  <!-- Outer Frame Corner Accents -->
  <g stroke="#2b4369" stroke-width="1.6" fill="none">
    <path d="M 14 32 L 14 14 L 32 14" />
    <path d="M 946 32 L 946 14 L 928 14" />
    <path d="M 14 288 L 14 306 L 32 306" />
    <path d="M 946 288 L 946 306 L 928 306" />
  </g>

  <!-- ======================================================== -->
  <!-- CENTRAL DARK-GLASS PANEL (HERO CORE)                     -->
  <!-- ======================================================== -->
  <g>
    <!-- Ambient Glass Drop Shadow -->
    <rect x="140" y="20" width="680" height="280" rx="14" fill="#000000" opacity="0.65" />

    <!-- Main Glass Body with Subtle Micro Grid -->
    <rect x="140" y="20" width="680" height="280" rx="14" fill="url(#techGlassBg)" stroke="#223a5e" stroke-width="1.4" />
    <rect x="140" y="20" width="680" height="280" rx="14" fill="url(#panelInnerGrid)" />

    <!-- Top Rim Glass Highlight & Center Accent Notch -->
    <line x1="155" y1="21" x2="805" y2="21" stroke="#4facfe" stroke-width="1.2" opacity="0.6" />
    <rect x="450" y="20" width="60" height="3" rx="1.5" fill="#00f2fe" opacity="0.9" filter="url(#glowCyan)" />

    <!-- 1. HEADER ROW (Top-Left Mac Dots & Daemon Text / Top-Right Status ONLINE) -->
    <g transform="translate(165, 46)">
      <!-- Mac-style Status Dots -->
      <circle cx="0" cy="0" r="3.6" fill="#ff5f56" />
      <circle cx="11" cy="0" r="3.6" fill="#ffbd2e" />
      <circle cx="22" cy="0" r="3.6" fill="#27c93f" />

      <!-- Daemon Header Text -->
      <text x="38" y="3.6" class="font-mono" fill="#6a93c7" font-size="10" font-weight="700" letter-spacing="1.2">
        MEGAPASS // BENCH_DAEMON_V2.0
      </text>

      <!-- Status ONLINE (Top-Right) -->
      <g transform="translate(595, 0)">
        <circle class="live-dot" cx="30" cy="0" r="4" />
        <text x="18" y="3.6" text-anchor="end" class="font-mono" fill="#00ff66" font-size="10" font-weight="800" letter-spacing="1.2">
          ONLINE
        </text>
      </g>
    </g>

    <!-- 2. MAIN TITLE: Brilliant Bold White -->
    <text x="480" y="106" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="2.5">
      HIZAM NAHARI
    </text>

    <!-- 3. SUB-TITLE: Glowing Neon Cyan -->
    <text x="480" y="138" text-anchor="middle" class="font-mono" fill="#00f2fe" font-size="12" font-weight="800" letter-spacing="2.2" filter="url(#glowCyanSubtle)">
      CIRCUIT TECHNICIAN • HARDWARE • SYSTEMS AUTOMATION
    </text>

    <!-- 4. CAPSULE PILL BADGE: Core Capabilities -->
    <g transform="translate(480, 186)">
      <rect x="-240" y="-14" width="480" height="28" rx="14" fill="url(#capsuleBg)" stroke="#1d385f" stroke-width="1.2" />
      <text x="0" y="4.2" text-anchor="middle" class="font-mono" font-size="11" letter-spacing="0.5">
        <tspan fill="#00ff66" font-weight="800" filter="url(#glowGreen)">⚡ AI Agents Orchestrator</tspan>
        <tspan fill="#3a5a82" font-weight="600">   •   </tspan>
        <tspan fill="#d4e6fc" font-weight="700">5-Node Linux Mesh</tspan>
        <tspan fill="#3a5a82" font-weight="600">   •   </tspan>
        <tspan fill="#00f2fe" font-weight="700">Circuit Diagnostics</tspan>
      </text>
    </g>

    <!-- 5. BOTTOM FOOTER LINE: Uniform Muted Cyan -->
    <g transform="translate(480, 244)">
      <text x="0" y="0" text-anchor="middle" class="font-mono" fill="#88ccee" font-size="11.5" font-weight="600" letter-spacing="0.5">
        <tspan fill="#7ec8e3">📍 Sidoarjo, ID</tspan>
        <tspan fill="#2e577d">   •   </tspan>
        <tspan fill="#7ec8e3">🏆 BNSP 100/100 Theory</tspan>
        <tspan fill="#2e577d">   •   </tspan>
        <tspan fill="#7ec8e3">💻 Megapass Intra Solusindo</tspan>
      </text>
    </g>
  </g>
</svg>
