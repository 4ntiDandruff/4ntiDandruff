<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="45%" stop-color="#0a101b" />
      <stop offset="85%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Tech Glass Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121e33" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#09101c" stop-opacity="0.85" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Traces -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff9933" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d6e4ff" />
    </linearGradient>

    <!-- Circuit Grid Pattern -->
    <pattern id="pcbGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#121e33" stroke-width="0.8" opacity="0.6" />
      <circle cx="24" cy="0" r="1.2" fill="#1b2d4b" opacity="0.8" />
    </pattern>

    <style>
      @keyframes pulseTrace1 {
        0% { stroke-dashoffset: 800; opacity: 0.1; }
        40% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.1; }
      }
      @keyframes pulseTrace2 {
        0% { stroke-dashoffset: 600; opacity: 0.1; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.1; }
      }
      @keyframes blinkOnline {
        0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 6px #00ff66); }
        50% { fill: #008f39; filter: none; }
      }
      @keyframes signalSweep {
        0% { transform: translateX(0); opacity: 0.8; }
        100% { transform: translateX(960px); opacity: 0; }
      }
      .anim-trace-cyan {
        stroke-dasharray: 140 560;
        animation: pulseTrace1 4.5s linear infinite;
      }
      .anim-trace-orange {
        stroke-dasharray: 120 480;
        animation: pulseTrace2 3.8s linear infinite;
        animation-delay: 1.2s;
      }
      .live-dot {
        animation: blinkOnline 2s ease-in-out infinite;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="960" height="300" rx="14" fill="url(#bgGrad)" stroke="#1a2b48" stroke-width="1.5" />
  
  <!-- PCB Grid Overlay -->
  <rect width="960" height="300" rx="14" fill="url(#pcbGrid)" />

  <!-- Outer Intricate Circuit Bus (Background Inactive) -->
  <g stroke="#14233c" stroke-width="2" fill="none">
    <!-- Left PCB Bus -->
    <path d="M 20 40 L 90 40 L 130 80 L 190 80" />
    <path d="M 20 80 L 70 80 L 110 120 L 170 120" />
    <path d="M 20 120 L 100 120 L 140 160 L 190 160" />
    <path d="M 20 160 L 60 160 L 100 200 L 180 200" />
    <path d="M 20 200 L 110 200 L 130 220 L 200 220" />
    <path d="M 20 240 L 80 240 L 120 280 L 220 280" />
    <path d="M 60 20 L 60 60 L 90 90 L 90 150" />
    <path d="M 140 280 L 140 230 L 170 200" />

    <!-- Right PCB Bus -->
    <path d="M 940 40 L 870 40 L 830 80 L 770 80" />
    <path d="M 940 80 L 890 80 L 850 120 L 790 120" />
    <path d="M 940 120 L 860 120 L 820 160 L 770 160" />
    <path d="M 940 160 L 900 160 L 860 200 L 780 200" />
    <path d="M 940 200 L 850 200 L 830 220 L 760 220" />
    <path d="M 940 240 L 880 240 L 840 280 L 740 280" />
    <path d="M 900 20 L 900 60 L 870 90 L 870 150" />
    <path d="M 820 280 L 820 230 L 790 200" />
  </g>

  <!-- Glowing Active PCB Traces (Left - Cyan) -->
  <g stroke="url(#neonCyan)" stroke-width="2.2" fill="none" filter="url(#glowCyan)">
    <path class="anim-trace-cyan" d="M 20 40 L 90 40 L 130 80 L 190 80" />
    <path class="anim-trace-cyan" d="M 20 120 L 100 120 L 140 160 L 190 160" style="animation-delay: 1.5s;" />
    <path class="anim-trace-cyan" d="M 20 200 L 110 200 L 130 220 L 200 220" style="animation-delay: 2.8s;" />
  </g>

  <!-- Glowing Active PCB Traces (Right - Orange) -->
  <g stroke="url(#neonOrange)" stroke-width="2.2" fill="none" filter="url(#glowOrange)">
    <path class="anim-trace-orange" d="M 940 40 L 870 40 L 830 80 L 770 80" />
    <path class="anim-trace-orange" d="M 940 160 L 900 160 L 860 200 L 780 200" style="animation-delay: 0.8s;" />
    <path class="anim-trace-orange" d="M 940 240 L 880 240 L 840 280 L 740 280" style="animation-delay: 2.2s;" />
  </g>

  <!-- Solder Vias & SMD Test Pads (Left) -->
  <g fill="#07101e" stroke="#00f2fe" stroke-width="1.6">
    <circle cx="20" cy="40" r="3.5" />
    <circle cx="190" cy="80" r="3.5" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="20" cy="80" r="3" stroke="#25436e" />
    <circle cx="170" cy="120" r="3" stroke="#25436e" />
    <circle cx="20" cy="120" r="3.5" />
    <circle cx="190" cy="160" r="3.5" fill="#00f2fe" />
    <circle cx="20" cy="160" r="3" stroke="#25436e" />
    <circle cx="180" cy="200" r="3" stroke="#25436e" />
    <circle cx="20" cy="200" r="3.5" />
    <circle cx="200" cy="220" r="3.5" fill="#00f2fe" />
    <circle cx="220" cy="280" r="3.5" fill="#00f2fe" />
  </g>

  <!-- Solder Vias & SMD Test Pads (Right) -->
  <g fill="#07101e" stroke="#ff9933" stroke-width="1.6">
    <circle cx="940" cy="40" r="3.5" />
    <circle cx="770" cy="80" r="3.5" fill="#ff9933" filter="url(#glowOrange)" />
    <circle cx="940" cy="80" r="3" stroke="#5a2d24" />
    <circle cx="790" cy="120" r="3" stroke="#5a2d24" />
    <circle cx="940" cy="120" r="3" stroke="#5a2d24" />
    <circle cx="770" cy="160" r="3.5" fill="#ff9933" />
    <circle cx="940" cy="160" r="3.5" />
    <circle cx="780" cy="200" r="3.5" fill="#ff3366" />
    <circle cx="940" cy="200" r="3" stroke="#5a2d24" />
    <circle cx="760" cy="220" r="3.5" fill="#ff9933" />
    <circle cx="740" cy="280" r="3.5" fill="#ff9933" />
  </g>

  <!-- Corner Brackets (Tech-Frame) -->
  <g stroke="#3a5a8c" stroke-width="1.8" fill="none">
    <path d="M 16 35 L 16 16 L 35 16" />
    <path d="M 944 35 L 944 16 L 925 16" />
    <path d="M 16 265 L 16 284 L 35 284" />
    <path d="M 944 265 L 944 284 L 925 284" />
  </g>

  <!-- Main Center Glass Card -->
  <g>
    <!-- Drop Shadow for Glass Card -->
    <rect x="210" y="24" width="540" height="252" rx="10" fill="#000000" opacity="0.45" />
    
    <!-- Tech-Glass Body -->
    <rect x="210" y="24" width="540" height="252" rx="10" fill="url(#glassGrad)" stroke="#233a60" stroke-width="1.2" />
    
    <!-- Top Glass Highlight Line -->
    <line x1="220" y1="25" x2="740" y2="25" stroke="#4facfe" stroke-width="1.2" opacity="0.6" />

    <!-- Top Corner Accents / Notch Details -->
    <rect x="460" y="24" width="40" height="3" fill="#00f2fe" opacity="0.8" />
    
    <!-- Card Top Header Row -->
    <g transform="translate(230, 48)">
      <!-- Left Indicator -->
      <circle cx="0" cy="0" r="3.5" fill="#00f2fe" />
      <circle cx="10" cy="0" r="3.5" fill="#ffbd2e" />
      <circle cx="20" cy="0" r="3.5" fill="#ff3366" />
      <text x="35" y="4" class="font-mono" fill="#6c93c4" font-size="10.5" font-weight="700" letter-spacing="1.2">
        MEGAPASS // BENCH_DAEMON_V2.0
      </text>

      <!-- Right Indicator / Status -->
      <g transform="translate(455, 0)">
        <circle class="live-dot" cx="30" cy="0" r="4" />
        <text x="20" y="4" text-anchor="end" class="font-mono" fill="#00ff66" font-size="10" font-weight="800" letter-spacing="1">
          ONLINE
        </text>
      </g>
    </g>

    <!-- Center Line Divider -->
    <line x1="230" y1="62" x2="730" y2="62" stroke="#1c2f4d" stroke-width="1" />

    <!-- MAIN NAME -->
    <text x="480" y="112" text-anchor="middle" class="font-sans" fill="url(#textGrad)" font-size="34" font-weight="900" letter-spacing="1.5">
      HIZAM NAHARI
    </text>

    <!-- SUBTITLE / ROLE -->
    <text x="480" y="138" text-anchor="middle" class="font-mono" fill="url(#neonCyan)" font-size="12" font-weight="800" letter-spacing="2.2" filter="url(#glowCyan)">
      CIRCUIT TECHNICIAN • HARDWARE • SYSTEMS AUTOMATION
    </text>

    <!-- Tagline Ethos Box -->
    <g transform="translate(480, 168)">
      <rect x="-210" y="-12" width="420" height="24" rx="6" fill="#07101c" stroke="#1d3557" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" class="font-mono" fill="#8cb7f5" font-size="10.5" font-weight="500" letter-spacing="0.5">
        "Trace dead rails on bench, automate the rest with 0% CPU overhead."
      </text>
    </g>

    <!-- Proportional Pro Badges Row (Inside Card) -->
    <g transform="translate(480, 212)">
      <!-- Badge 1: Verified Credentials -->
      <g transform="translate(-195, 0)">
        <rect x="0" y="0" width="124" height="22" rx="4" fill="#0a192f" stroke="#00f2fe" stroke-width="1" />
        <circle cx="10" cy="11" r="3.5" fill="#00f2fe" />
        <text x="20" y="14.5" class="font-mono" fill="#cce6ff" font-size="9" font-weight="700">megapass/teknisi</text>
      </g>

      <!-- Badge 2: Location -->
      <g transform="translate(-63, 0)">
        <rect x="0" y="0" width="122" height="22" rx="4" fill="#141a29" stroke="#ff3366" stroke-width="1" />
        <circle cx="10" cy="11" r="3.5" fill="#ff3366" />
        <text x="20" y="14.5" class="font-mono" fill="#ffccd5" font-size="9" font-weight="700">Sidoarjo, ID</text>
      </g>

      <!-- Badge 3: BNSP Score -->
      <g transform="translate(67, 0)">
        <rect x="0" y="0" width="128" height="22" rx="4" fill="#13241b" stroke="#00ff66" stroke-width="1" />
        <circle cx="10" cy="11" r="3.5" fill="#00ff66" />
        <text x="20" y="14.5" class="font-mono" fill="#ccffdd" font-size="9" font-weight="700">BNSP 100/100 Teori</text>
      </g>
    </g>

    <!-- Mini Bottom Metrics -->
    <g transform="translate(480, 256)">
      <text x="-160" y="0" text-anchor="middle" class="font-mono" fill="#4f729b" font-size="9.5">⚡ 12+ Years Bench Experience</text>
      <text x="0" y="0" text-anchor="middle" class="font-mono" fill="#4f729b" font-size="9.5">•</text>
      <text x="160" y="0" text-anchor="middle" class="font-mono" fill="#4f729b" font-size="9.5">🔬 1000+ Hardware Devices Fixed</text>
    </g>
  </g>
</svg>
