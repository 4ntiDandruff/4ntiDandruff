<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="streamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="probeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pointGlowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pointGlowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern for SMT PCB Matrix -->
    <pattern id="matrixGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#111c2e" />
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0d1624" stroke-width="0.5" />
    </pattern>

    <style>
      @keyframes gantryMove {
        0% { transform: translateX(0px) translateY(0px); }
        20% { transform: translateX(240px) translateY(10px); }
        40% { transform: translateX(480px) translateY(-8px); }
        60% { transform: translateX(680px) translateY(12px); }
        80% { transform: translateX(380px) translateY(18px); }
        100% { transform: translateX(0px) translateY(0px); }
      }

      @keyframes probeTouch {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      @keyframes signalPulse1 {
        0%, 100% { fill: #00f2fe; filter: drop-shadow(0 0 8px #00f2fe); r: 4.5; }
        50% { fill: #0f2742; filter: none; r: 3; }
      }

      @keyframes signalPulse2 {
        0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 8px #00ff66); r: 4.5; }
        50% { fill: #0d2e1b; filter: none; r: 3; }
      }

      @keyframes signalPulse3 {
        0%, 100% { fill: #ff9933; filter: drop-shadow(0 0 6px #ff9933); r: 4; }
        50% { fill: #381f14; filter: none; r: 2.5; }
      }

      @keyframes dataStream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .probe-gantry {
        animation: gantryMove 12s ease-in-out infinite;
      }
      .probe-needle {
        animation: probeTouch 1.5s ease-in-out infinite alternate;
      }
      .node-cyan {
        animation: signalPulse1 2.4s ease-in-out infinite;
      }
      .node-green {
        animation: signalPulse2 3.1s ease-in-out infinite;
      }
      .node-orange {
        animation: signalPulse3 1.8s ease-in-out infinite;
      }
      .trace-flow {
        stroke-dasharray: 20 60;
        animation: dataStream 3s linear infinite;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="960" height="220" rx="10" fill="url(#streamBg)" stroke="#1a2b48" stroke-width="1.2" />
  
  <!-- PCB Matrix Background -->
  <rect width="960" height="220" rx="10" fill="url(#matrixGrid)" />

  <!-- Fixed Signal Trace Tracks on PCB (Bus lines) -->
  <g stroke="#14233c" stroke-width="2" fill="none">
    <path d="M 40 40 L 220 40 L 260 80 L 540 80 L 580 120 L 920 120" />
    <path d="M 40 100 L 180 100 L 220 140 L 620 140 L 660 180 L 920 180" />
    <path d="M 40 160 L 300 160 L 340 120 L 480 120 L 520 60 L 920 60" />
    <path d="M 120 20 L 120 200" />
    <path d="M 400 20 L 400 200" />
    <path d="M 720 20 L 720 200" />
  </g>

  <!-- Active Signal Pulsing Traces -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" filter="url(#probeGlow)" opacity="0.8">
    <path class="trace-flow" d="M 40 40 L 220 40 L 260 80 L 540 80 L 580 120 L 920 120" />
    <path class="trace-flow" d="M 40 160 L 300 160 L 340 120 L 480 120 L 520 60 L 920 60" style="animation-delay: 1.2s;" stroke="#00ff66" />
  </g>

  <!-- Contribution & Diagnostic Matrix Nodes (Simulating active matrix cells) -->
  <g>
    <!-- Row 1 -->
    <circle cx="80" cy="40" r="3" fill="#1b3354" />
    <circle cx="140" cy="40" r="4" class="node-cyan" />
    <circle cx="200" cy="40" r="3" fill="#1b3354" />
    <circle cx="320" cy="80" r="4" class="node-green" />
    <circle cx="380" cy="80" r="3" fill="#1b3354" />
    <circle cx="440" cy="80" r="4.5" class="node-cyan" />
    <circle cx="500" cy="80" r="3" fill="#1b3354" />
    <circle cx="640" cy="120" r="4" class="node-green" />
    <circle cx="700" cy="120" r="3" fill="#1b3354" />
    <circle cx="780" cy="120" r="4" class="node-cyan" />
    <circle cx="860" cy="120" r="3" fill="#1b3354" />

    <!-- Row 2 -->
    <circle cx="100" cy="100" r="4" class="node-cyan" />
    <circle cx="160" cy="100" r="3" fill="#1b3354" />
    <circle cx="280" cy="140" r="4" class="node-orange" />
    <circle cx="360" cy="140" r="3" fill="#1b3354" />
    <circle cx="420" cy="140" r="4" class="node-cyan" />
    <circle cx="560" cy="140" r="4" class="node-green" />
    <circle cx="720" cy="180" r="4" class="node-cyan" />
    <circle cx="820" cy="180" r="4" class="node-green" />

    <!-- Row 3 -->
    <circle cx="60" cy="160" r="3" fill="#1b3354" />
    <circle cx="140" cy="160" r="4" class="node-green" />
    <circle cx="220" cy="160" r="4" class="node-cyan" />
    <circle cx="400" cy="120" r="3" fill="#1b3354" />
    <circle cx="460" cy="120" r="4" class="node-orange" />
    <circle cx="600" cy="60" r="4" class="node-cyan" />
    <circle cx="680" cy="60" r="3" fill="#1b3354" />
    <circle cx="760" cy="60" r="4" class="node-green" />
    <circle cx="840" cy="60" r="4" class="node-cyan" />
  </g>

  <!-- Precision Multi-Probe Microscopic Probing Head (Gantry Assembly) -->
  <g class="probe-gantry" transform="translate(160, 40)">
    <!-- Top Precision Guide Rail -->
    <rect x="-30" y="-20" width="160" height="8" rx="2" fill="#0d1b2e" stroke="#25436e" stroke-width="1" />
    <circle cx="-20" cy="-16" r="2" fill="#00f2fe" />
    <circle cx="120" cy="-16" r="2" fill="#00f2fe" />

    <!-- Robotic Toolhead Base Carrier -->
    <rect x="0" y="-12" width="100" height="36" rx="4" fill="#0b172a" stroke="#00f2fe" stroke-width="1.4" filter="url(#probeGlow)" />
    
    <!-- Status HUD on Probe Head -->
    <text x="50" y="3" text-anchor="middle" class="font-mono" fill="#00f2fe" font-size="7.5" font-weight="700" letter-spacing="1">
      MULTI-PROBE // POS_ACTIVE
    </text>
    <text x="50" y="14" text-anchor="middle" class="font-mono" fill="#8cb7f5" font-size="7" font-weight="500">
      VOLT: 3.32V • RAIL: OK
    </text>

    <!-- Multi-Probe Needles (4 Spring-Loaded Micro Probes) -->
    <g class="probe-needle" transform="translate(15, 24)">
      <!-- Needle 1 (VCC / Cyan) -->
      <line x1="10" y1="0" x2="10" y2="46" stroke="#00f2fe" stroke-width="1.6" />
      <polygon points="8,46 12,46 10,54" fill="#00f2fe" filter="url(#pointGlowCyan)" />
      
      <!-- Needle 2 (GND / Green) -->
      <line x1="25" y1="0" x2="25" y2="46" stroke="#00ff66" stroke-width="1.6" />
      <polygon points="23,46 27,46 25,54" fill="#00ff66" filter="url(#pointGlowGreen)" />

      <!-- Needle 3 (DATA / Orange) -->
      <line x1="45" y1="0" x2="45" y2="46" stroke="#ff9933" stroke-width="1.6" />
      <polygon points="43,46 47,46 45,54" fill="#ff9933" />

      <!-- Needle 4 (CLK / Cyan) -->
      <line x1="60" y1="0" x2="60" y2="46" stroke="#00f2fe" stroke-width="1.6" />
      <polygon points="58,46 62,46 60,54" fill="#00f2fe" filter="url(#pointGlowCyan)" />

      <!-- Contact Plasma Sparks at Needle Tips -->
      <circle cx="10" cy="54" r="3.5" fill="#00f2fe" filter="url(#probeGlow)" />
      <circle cx="25" cy="54" r="3" fill="#00ff66" filter="url(#pointGlowGreen)" />
      <circle cx="45" cy="54" r="2.5" fill="#ff9933" />
      <circle cx="60" cy="54" r="3.5" fill="#00f2fe" filter="url(#probeGlow)" />
    </g>
  </g>

  <!-- Bottom Diagnostic Telemetry Line -->
  <g transform="translate(30, 204)">
    <text x="0" y="0" class="font-mono" fill="#4d6b94" font-size="9" font-weight="600" letter-spacing="1">
      PROBE STATION: AUTO_TRACING_ONLINE • 128 CHANNELS • NOISE: -114dBm • SAMPLING: 500MS/s
    </text>
    <text x="900" y="0" text-anchor="end" class="font-mono" fill="#00ff66" font-size="9" font-weight="700">
      ● BENCH TELEMETRY STREAM
    </text>
  </g>
</svg>
