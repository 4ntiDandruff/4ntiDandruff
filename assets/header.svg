<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="210">
  <defs>
    <!-- Background Dark Palette -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Linear / Vercel Accent Glow -->
    <radialGradient id="subtleGlow" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Hairline Filter for Text -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    /* Terminal Animations */
    .c‍ursor {
      animation: blink 1.05s steps(2, start) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .pulse-dot {
      animation: livePulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .shimmer {
      stroke-dasharray: 60 200;
      animation: shimmerFlow 6s linear infinite;
    }
    @keyframes shimmerFlow {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Outer Window Container (Double Bezel) -->
  <rect x="1" y="1" width="848" height="208" rx="10" fill="url(#terminalBg)" stroke="#30363d" stroke-width="1.2"/>
  <rect x="2" y="2" width="846" height="206" rx="9" fill="url(#subtleGlow)"/>

  <!-- Top Title Bar -->
  <path d="M 1,38 L 849,38" stroke="#21262d" stroke-width="1"/>

  <!-- Window Controls (Mac Style Minimalist Dots) -->
  <g transform="translate(20, 20)">
    <circle cx="0" cy="0" r="5" fill="#ff5f56" opacity="0.8"/>
    <circle cx="16" cy="0" r="5" fill="#febc2e" opacity="0.8"/>
    <circle cx="32" cy="0" r="5" fill="#28c840" opacity="0.8"/>
  </g>

  <!-- Title Bar Tab -->
  <g transform="translate(75, 11)">
    <rect x="0" y="0" width="220" height="27" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="18" y="17" class="font-mono" font-size="11" font-weight="600" fill="#c9d1d9" letter-spacing="0.5">
      hizam@megapass-bench:~
    </text>
  </g>

  <!-- Topbar Status Badges (Right Aligned) -->
  <g transform="translate(828, 20)" text-anchor="end">
    <circle cx="-138" cy="0" r="3.5" fill="#3fb950" class="pulse-dot"/>
    <text x="-124" y="3.5" class="font-mono" font-size="10" font-weight="600" fill="#7ee787" letter-spacing="0.5">BENCH RUNTIME</text>
    <text x="0" y="3.5" class="font-mono" font-size="10" fill="#8b949e" letter-spacing="0.5">SIDOARJO • ID</text>
  </g>

  <!-- Left Column: Primary Identity & High-Contrast Typography -->
  <g transform="translate(32, 75)">
    <!-- Identity Name -->
    <text x="0" y="0" class="font-sans" font-size="30" font-weight="800" fill="#f0f6fc" letter-spacing="1.5">
      HIZAM NAHARI
    </text>

    <!-- Subtitle Role -->
    <text x="0" y="26" class="font-mono" font-size="11.5" font-weight="600" fill="#58a6ff" letter-spacing="2">
      CIRCUIT TECHNICIAN <tspan fill="#30363d">//</tspan> <tspan fill="#3fb950">SYSTEMS AUTOMATION</tspan>
    </text>

    <!-- Description Badge -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="370" height="26" rx="5" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
      <text x="12" y="17" class="font-mono" font-size="10.5" fill="#8b949e">
        <tspan fill="#d29922">BNSP Certified</tspan> • <tspan fill="#bc8cff">BMY Specialist</tspan> • <tspan fill="#7ee787">12+ Yrs</tspan>
      </text>
    </g>

    <!-- Footer Benchmark Tag -->
    <text x="0" y="98" class="font-mono" font-size="9.5" fill="#484f58" letter-spacing="0.5">
      HARDWARE REPAIR LAB • MEGAPASS INTRA SOLUSINDO
    </text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="435" y1="52" x2="435" y2="190" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Column: Interactive Cyber-Terminal Session -->
  <g transform="translate(455, 68)" class="font-mono">
    <!-- Command 1 -->
    <g transform="translate(0, 8)">
      <text x="0" y="0" font-size="11" fill="#79c0ff" font-weight="600">megapass:~$</text>
      <text x="88" y="0" font-size="11" fill="#c9d1d9">trace_rails --boardview</text>
      <!-- Output 1 -->
      <text x="0" y="20" font-size="10.5" fill="#8b949e">
        ↳ <tspan fill="#3fb950">✓ +3.3V_ALW: OK</tspan>  <tspan fill="#3fb950">✓ +5V_ALW: OK</tspan>
      </text>
      <text x="16" y="36" font-size="10.5" fill="#8b949e">
        ↳ <tspan fill="#d29922">⚡ VCORE SHORT: RESOLVED (IC REPLACED)</tspan>
      </text>
    </g>

    <!-- Command 2 -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-size="11" fill="#79c0ff" font-weight="600">megapass:~$</text>
      <text x="88" y="0" font-size="11" fill="#c9d1d9">auto-extract --daemon</text>
      <!-- Output 2 -->
      <text x="0" y="20" font-size="10.5" fill="#8b949e">
        ↳ <tspan fill="#58a6ff">[SYSTEMD USER UNIT: ACTIVE]</tspan>
      </text>
      <text x="16" y="36" font-size="10.5" fill="#3fb950">
        ↳ 9 safety fuses armed (0.0% CPU • 1.5MB RAM) <tspan fill="#58a6ff" class="c‍ursor">█</tspan>
      </text>
    </g>
  </g>
</svg>
