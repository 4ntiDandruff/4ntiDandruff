<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="230">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="40%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Subtle Emerald Glow -->
    <radialGradient id="emeraldRadial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridMicro" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f2937" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="24" cy="24" r="0.8" fill="#374151" opacity="0.6"/>
    </pattern>

    <!-- Signal Line Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .trace-dim {
      stroke: #1e293b;
      stroke-width: 1;
      fill: none;
      stroke-linecap: round;
    }
    .trace-live {
      stroke: #10b981;
      stroke-width: 1.2;
      fill: none;
      stroke-dasharray: 40 280;
      animation: signalFlow 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .trace-fast {
      stroke: #06b6d4;
      stroke-width: 1.2;
      fill: none;
      stroke-dasharray: 25 200;
      animation: signalFlow 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes signalFlow {
      from { stroke-dashoffset: 640; }
      to { stroke-dashoffset: 0; }
    }
    .beacon-pulse {
      animation: pulseAnim 2.5s infinite;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .cursor-blink {
      animation: blink 1.2s steps(2, start) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Outer Double-Bezel Frame -->
  <rect x="2" y="2" width="916" height="226" rx="14" fill="url(#canvasGrad)" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="6" y="6" width="908" height="218" rx="10" fill="url(#gridMicro)"/>
  <rect x="6" y="6" width="908" height="218" rx="10" fill="url(#emeraldRadial)"/>
  <rect x="6" y="6" width="908" height="218" rx="10" fill="none" stroke="#111827" stroke-width="1"/>

  <!-- Corner Calibration Marks (High-End Technical Blueprint Vibe) -->
  <g stroke="#374151" stroke-width="1" opacity="0.6">
    <path d="M 18,22 L 28,22 M 22,18 L 22,28"/>
    <path d="M 902,22 L 892,22 M 898,18 L 898,28"/>
    <path d="M 18,208 L 28,208 M 22,202 L 22,212"/>
    <path d="M 902,208 L 892,208 M 898,202 L 898,212"/>
  </g>

  <!-- Precision PCB Traces (Background Architecture) -->
  <g class="trace-dim">
    <path d="M 22,60 L 90,60 L 130,100 L 220,100"/>
    <path d="M 22,170 L 110,170 L 150,130 L 250,130"/>
    <path d="M 700,90 L 780,90 L 820,50 L 898,50"/>
    <path d="M 670,140 L 760,140 L 800,180 L 898,180"/>
    <!-- Center bus lines -->
    <path d="M 220,100 L 260,100 L 270,110 L 330,110"/>
    <path d="M 590,120 L 650,120 L 670,140"/>
  </g>

  <!-- Live Flowing Pulses (Hardware Signal Oscillations) -->
  <g filter="url(#softGlow)">
    <path d="M 22,60 L 90,60 L 130,100 L 220,100 L 260,100 L 270,110 L 330,110" class="trace-live"/>
    <path d="M 22,170 L 110,170 L 150,130 L 250,130" class="trace-fast"/>
    <path d="M 700,90 L 780,90 L 820,50 L 898,50" class="trace-fast"/>
    <path d="M 590,120 L 650,120 L 670,140 L 760,140 L 800,180 L 898,180" class="trace-live"/>
  </g>

  <!-- Technical Annotations (Left Flank) -->
  <g class="font-mono" font-size="9" fill="#64748b" opacity="0.8">
    <text x="28" y="48">RAIL: +3.3V_ALWAYS</text>
    <text x="28" y="195">SCOPE: 100MHz • 1GS/s</text>
    <text x="28" y="206">DIAG: BOARDVIEW_ACTIVE</text>
  </g>

  <!-- Technical Annotations (Right Flank) -->
  <g class="font-mono" font-size="9" fill="#64748b" opacity="0.8" text-anchor="end">
    <text x="892" y="48">SYSTEM: KERNEL_INOTIFY</text>
    <text x="892" y="195">RUNTIME: POSIX_DAEMON</text>
    <text x="892" y="206">LOCATION: -7.4478, 112.7183</text>
  </g>

  <!-- Center Identity & Typography Block -->
  <!-- 1. Top Island Tag -->
  <g transform="translate(460, 38)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#0b0f17" stroke="#1e293b" stroke-width="1"/>
    <!-- Live Status LED Indicator -->
    <circle cx="-118" cy="0" r="4.5" fill="#10b981" opacity="0.3" class="beacon-pulse"/>
    <circle cx="-118" cy="0" r="2.5" fill="#10b981"/>
    <text x="-104" y="3.5" class="font-mono" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1.5">BENCH DIAGNOSTICS &amp; OPS</text>
  </g>

  <!-- 2. Main Title (High-End Contrast Typography) -->
  <g transform="translate(460, 108)" text-anchor="middle">
    <text y="0" class="font-sans" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="2">
      HIZAM NAHARI
    </text>
  </g>

  <!-- 3. Subtitle Role Line -->
  <g transform="translate(460, 142)" text-anchor="middle" class="font-mono">
    <text y="0" font-size="12" font-weight="600" fill="#10b981" letter-spacing="2.5">
      CIRCUIT TECHNICIAN <tspan fill="#475569">///</tspan> SYSTEMS AUTOMATION
    </text>
  </g>

  <!-- 4. Bottom Terminal Line (Real Origin Story) -->
  <g transform="translate(460, 178)" text-anchor="middle" class="font-mono">
    <rect x="-240" y="-11" width="480" height="22" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
    <text y="3" font-size="10.5" fill="#94a3b8" letter-spacing="0.5">
      <tspan fill="#38bdf8">megapass:~$</tspan> trace_rails --bench | automate_daemon <tspan fill="#10b981" class="cursor-blink">█</tspan>
    </text>
  </g>
</svg>
